# 사이드바 상위 카테고리 아이콘
# - 키: 카테고리 이름 (대문자로 적기. 한글은 그대로)
# - icon: Font Awesome 무료 아이콘 클래스 (https://fontawesome.com/search?ic=free 에서 검색)
# - color: 아이콘 색
# 여기에 없는 카테고리는 _default 아이콘을 사용

